# .github/workflows/pr.yml
name: PR checks
on: pull_request
concurrency: { group: pr-${{ github.ref }}, cancel-in-progress: true }
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        task: ["spotlessCheck detekt", "lintDebug", "testDebugUnitTest validateDebugScreenshotTest"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4        # dependency and build caching
      - run: ./gradlew ${{ matrix.task }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: reports-${{ strategy.job-index }}, path: "**/build/reports/" }
