name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: echo "Using password ${{ secrets.KEYSTORE_PASSWORD }}"
      - run: echo "${{ secrets.KEYSTORE }}" | base64 -d > app/release.jks
      - run: ./gradlew lint test assembleDebug bundleRelease
