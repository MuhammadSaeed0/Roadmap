<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <title>DevPath — Full-Stack Developer Academy</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A bilingual learning platform for becoming a full-stack .NET + Angular developer.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script>
    // Apply the saved language, direction and theme before Angular starts, so the page
    // never flashes in the wrong direction or colour. Angular takes over from here.
    (function () {
      try {
        var lang = localStorage.getItem('devpath.lang') === 'ar' ? 'ar' : 'en';
        var theme = localStorage.getItem('devpath.theme') || 'system';
        if (theme === 'system') theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        var html = document.documentElement;
        html.lang = lang;
        html.dir = lang === 'ar' ? 'rtl' : 'ltr';
        html.dataset.theme = theme;
      } catch (e) { /* storage unavailable: defaults apply */ }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
  <noscript>DevPath needs JavaScript to run.</noscript>
</body>
</html>
